services:
  - type: web
    name: bybit-signal-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT
      - key: SYMBOLS_MODE
        value: top
      - key: SYMBOLS_TOP_N
        value: "150"
      - key: SYMBOL_PAUSE_SEC
        value: "0.3"
      - key: HTF
        value: "240"
      - key: LTF
        value: "15"
      - key: SCAN_INTERVAL
        value: "900"
      - key: RISK_REWARD_MIN
        value: "2.0"
      - key: SEND_NO_TRADE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SHADOW_TRACKING
        value: "true"
      - key: STATE_BACKEND
        value: sqlite
      - key: DB_PATH
        value: data/bot.db
      - key: GITHUB_TOKEN
        sync: false
      - key: GIST_SYNC
        value: "true"
